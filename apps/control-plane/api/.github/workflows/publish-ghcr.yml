name: Publish immutable multi-arch image

on:
  workflow_dispatch:
  push:
    branches: [feature/sing-box-subscribe]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/1linhao/trojan-panel

jobs:
  binaries:
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - run: |
          mkdir -p build
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} \
            go build -trimpath -ldflags "-s -w -buildid=" \
            -o build/trojan-panel-linux-${{ matrix.arch }} .
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.arch }}
          path: build/*

  publish:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: build
          merge-multiple: true
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:kernel-upgrade-${{ github.sha }}
      - run: echo '${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}' > image-digest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: image-digest
          path: image-digest.txt
