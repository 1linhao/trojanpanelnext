name: Publish immutable multi-arch image

on:
  workflow_dispatch:
  push:
    branches: [feature/sing-box-subscribe]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/1linhao/trojan-panel-ui

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint:kernel-upgrade
      - run: yarn build
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:kernel-upgrade-${{ github.sha }}
      - run: echo '${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}' > image-digest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: image-digest
          path: image-digest.txt
