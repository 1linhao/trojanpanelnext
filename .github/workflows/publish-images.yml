name: Publish product images

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version label, for example 0.1.0-rc.1
        required: true
        type: string
      publish:
        description: Push images to GHCR
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/1linhao/trojanpanelnext-api
  WEB_IMAGE: ghcr.io/1linhao/trojanpanelnext-web
  NODE_AGENT_IMAGE: ghcr.io/1linhao/trojanpanelnext-node-agent
  RESCUE_XRAY_VERSION: v26.3.27
  RESCUE_HYSTERIA_VERSION: v2.10.0

jobs:
  prepare:
    name: prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: release
        name: Validate version and release mode
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          DISPATCH_PUBLISH: ${{ inputs.publish }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            raw_version="$GITHUB_REF_NAME"
            publish=true
          else
            raw_version="$DISPATCH_VERSION"
            publish="$DISPATCH_PUBLISH"
          fi
          version="${raw_version#v}"
          source deploy/installer/release/release-contract.sh
          release_semver_is_valid "$version"
          [[ "$publish" == true || "$publish" == false ]]
          printf 'version=%s\npublish=%s\n' "$version" "$publish" >>"$GITHUB_OUTPUT"

  api-binaries:
    name: API binary (${{ matrix.arch }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-plane/api
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.23.x
          cache: true
          cache-dependency-path: apps/control-plane/api/go.sum
      - name: Build immutable Linux binary
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p build
          CGO_ENABLED=0 GOOS=linux GOARCH="$TARGET_ARCH" \
            go build -trimpath -ldflags "-s -w -buildid=" \
            -o "build/trojan-panel-linux-$TARGET_ARCH" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-binary-${{ matrix.arch }}
          path: apps/control-plane/api/build/*
          if-no-files-found: error
          retention-days: 2

  api-image:
    name: API image
    needs: [prepare, api-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: api-binary-*
          path: apps/control-plane/api/build
          merge-multiple: true
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        if: needs.prepare.outputs.publish == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.API_IMAGE }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable=${{ !contains(needs.prepare.outputs.version, '-') }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: apps/control-plane/api
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.prepare.outputs.publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=trojanpanelnext-api
          cache-to: type=gha,mode=max,scope=trojanpanelnext-api
          sbom: true
          provenance: mode=max
      - id: attest
        name: Attest published image
        if: needs.prepare.outputs.publish == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.API_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Preserve image attestation bundle
        if: needs.prepare.outputs.publish == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-attestation-api
          path: ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 2

  web-image:
    name: Web image
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: apps/control-plane/web/yarn.lock
      - name: Build Web distribution
        working-directory: apps/control-plane/web
        run: |
          npx --yes yarn@1.22.22 install --frozen-lockfile
          npx --yes yarn@1.22.22 build
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        if: needs.prepare.outputs.publish == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.WEB_IMAGE }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable=${{ !contains(needs.prepare.outputs.version, '-') }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: apps/control-plane/web
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.prepare.outputs.publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=trojanpanelnext-web
          cache-to: type=gha,mode=max,scope=trojanpanelnext-web
          sbom: true
          provenance: mode=max
      - id: attest
        name: Attest published image
        if: needs.prepare.outputs.publish == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.WEB_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Preserve image attestation bundle
        if: needs.prepare.outputs.publish == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-attestation-web
          path: ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 2

  node-agent-binaries:
    name: Node Agent binaries (${{ matrix.arch }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/node-agent
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.23.x
          cache: true
          cache-dependency-path: apps/node-agent/go.sum
      - name: Build Node Agent
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p build
          CGO_ENABLED=0 GOOS=linux GOARCH="$TARGET_ARCH" \
            go build -trimpath -ldflags "-s -w -buildid=" \
            -o "build/trojan-panel-core-linux-$TARGET_ARCH" .
      - name: Download and verify rescue Xray and Hysteria2
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -Eeuo pipefail
          if [[ "$TARGET_ARCH" == amd64 ]]; then
            xray_asset=Xray-linux-64.zip
          else
            xray_asset=Xray-linux-arm64-v8a.zip
          fi
          xray_base="https://github.com/XTLS/Xray-core/releases/download/${RESCUE_XRAY_VERSION}"
          curl -fsSLO "${xray_base}/${xray_asset}"
          curl -fsSLO "${xray_base}/${xray_asset}.dgst"
          expected="$(awk '$1 == "SHA2-256=" { print $2 }' "${xray_asset}.dgst")"
          test -n "$expected"
          printf '%s  %s\n' "$expected" "$xray_asset" | sha256sum -c -
          unzip -p "$xray_asset" xray >"build/xray-linux-$TARGET_ARCH"

          release="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/apernet/hysteria/releases/tags/app%2F${RESCUE_HYSTERIA_VERSION}")"
          asset="hysteria-linux-$TARGET_ARCH"
          asset_url="$(jq -r --arg name "$asset" '.assets[] | select(.name == $name) | .browser_download_url' <<<"$release")"
          hashes_url="$(jq -r '.assets[] | select(.name == "hashes.txt") | .browser_download_url' <<<"$release")"
          test -n "$asset_url"
          test -n "$hashes_url"
          curl -fsSL "$asset_url" -o "build/hysteria2-linux-$TARGET_ARCH"
          expected="$(curl -fsSL "$hashes_url" | awk -v name="$asset" '$2 == "build/" name { print $1 }')"
          test -n "$expected"
          printf '%s  %s\n' "$expected" "build/hysteria2-linux-$TARGET_ARCH" | sha256sum -c -
          chmod 755 "build/xray-linux-$TARGET_ARCH" "build/hysteria2-linux-$TARGET_ARCH"
      - name: Build NaiveProxy traffic adapter
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: >-
          OUTPUT="${GITHUB_WORKSPACE}/apps/node-agent/build/naiveproxy-linux-${TARGET_ARCH}"
          CGO_ENABLED=0 GOOS=linux GOARCH="${TARGET_ARCH}"
          bash scripts/build-naiveproxy-with-traffic.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: node-agent-binaries-${{ matrix.arch }}
          path: apps/node-agent/build/*
          if-no-files-found: error
          retention-days: 2

  node-agent-image:
    name: Node Agent image
    needs: [prepare, node-agent-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: node-agent-binaries-*
          path: apps/node-agent/build
          merge-multiple: true
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        if: needs.prepare.outputs.publish == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.NODE_AGENT_IMAGE }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable=${{ !contains(needs.prepare.outputs.version, '-') }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: apps/node-agent
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.prepare.outputs.publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=trojanpanelnext-node-agent
          cache-to: type=gha,mode=max,scope=trojanpanelnext-node-agent
          sbom: true
          provenance: mode=max
      - id: attest
        name: Attest published image
        if: needs.prepare.outputs.publish == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.NODE_AGENT_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Preserve image attestation bundle
        if: needs.prepare.outputs.publish == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-attestation-node-agent
          path: ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 2

  manifest:
    name: release installation assets
    needs: [prepare, api-image, web-image, node-agent-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.23.x
          cache: false
      - name: Download image attestation bundles
        if: needs.prepare.outputs.publish == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: image-attestation-*
          path: image-attestation-bundles
      - name: Log in to GHCR for image attestation verification
        if: needs.prepare.outputs.publish == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Generate and verify versioned installation assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          API_DIGEST: ${{ needs.api-image.outputs.digest }}
          WEB_DIGEST: ${{ needs.web-image.outputs.digest }}
          NODE_AGENT_DIGEST: ${{ needs.node-agent-image.outputs.digest }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for digest in "$API_DIGEST" "$WEB_DIGEST" "$NODE_AGENT_DIGEST"; do
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          done
          caddy_digest="$(docker buildx imagetools inspect caddy:2.8.4 --format '{{.Manifest.Digest}}')"
          mariadb_digest="$(docker buildx imagetools inspect mariadb:10.7.3 --format '{{.Manifest.Digest}}')"
          redis_digest="$(docker buildx imagetools inspect redis:6.2.7 --format '{{.Manifest.Digest}}')"
          deploy/installer/release/generate-assets.sh \
            --version "$VERSION" \
            --source-commit "$GITHUB_SHA" \
            --output release-assets \
            --api-image "$API_IMAGE@$API_DIGEST" \
            --web-image "$WEB_IMAGE@$WEB_DIGEST" \
            --node-agent-image "$NODE_AGENT_IMAGE@$NODE_AGENT_DIGEST" \
            --caddy-image "caddy@$caddy_digest" \
            --mariadb-image "mariadb@$mariadb_digest" \
            --redis-image "redis@$redis_digest"
          for config in release-assets/config-*.yaml; do
            release-assets/verify-assets.sh --assets-dir release-assets --config "$config"
          done
          mkdir release-upload
          deploy/installer/release/package-assets.sh \
            --assets-dir release-assets \
            --output "release-upload/trojanpanelnext-installer-${VERSION}.tar.gz"
          cp release-assets/release-manifest.json release-assets/SHA256SUMS release-upload/
      - id: attest-release-assets
        name: Attest release installation assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-upload/*
      - name: Verify attested subjects and digests
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ needs.prepare.outputs.publish }}
          API_DIGEST: ${{ needs.api-image.outputs.digest }}
          WEB_DIGEST: ${{ needs.web-image.outputs.digest }}
          NODE_AGENT_DIGEST: ${{ needs.node-agent-image.outputs.digest }}
          RELEASE_ATTESTATION_BUNDLE: ${{ steps.attest-release-assets.outputs.bundle-path }}
        shell: bash
        run: |
          set -Eeuo pipefail
          signer_workflow="${GITHUB_REPOSITORY}/.github/workflows/publish-images.yml"
          mkdir attestation-verification

          for file in release-upload/*; do
            name="${file##*/}"
            gh attestation verify "$file" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$signer_workflow" \
              --bundle "$RELEASE_ATTESTATION_BUNDLE" \
              --format json >"attestation-verification/file-${name}.json"
          done
          jq -s 'add' attestation-verification/file-*.json \
            >attestation-verification/files.json

          verify_args=(
            --manifest release-assets/release-manifest.json
            --files-dir release-upload
            --file-results attestation-verification/files.json
          )
          if [[ "$PUBLISH" == true ]]; then
            while IFS=$'\t' read -r key image digest bundle; do
              gh attestation verify "oci://${image}@${digest}" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$signer_workflow" \
                --bundle "$bundle" \
                --format json >"attestation-verification/image-${key}.json"
            done <<IMAGE_ATTESTATIONS
          api	${API_IMAGE}	${API_DIGEST}	image-attestation-bundles/image-attestation-api/attestation.json
          web	${WEB_IMAGE}	${WEB_DIGEST}	image-attestation-bundles/image-attestation-web/attestation.json
          node-agent	${NODE_AGENT_IMAGE}	${NODE_AGENT_DIGEST}	image-attestation-bundles/image-attestation-node-agent/attestation.json
          IMAGE_ATTESTATIONS
            jq -s 'add' attestation-verification/image-*.json \
              >attestation-verification/images.json
            verify_args+=(--image-results attestation-verification/images.json)
          fi

          deploy/installer/release/verify-attestation-results.sh "${verify_args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets-${{ needs.prepare.outputs.version }}
          path: release-upload/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: publish GitHub Release
    if: github.event_name == 'push' && needs.prepare.outputs.publish == 'true'
    needs: [prepare, manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets-${{ needs.prepare.outputs.version }}
          path: release-upload
      - name: Publish immutable installation assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: >-
          gh release create "v${VERSION}" release-upload/*
          --verify-tag --generate-notes
