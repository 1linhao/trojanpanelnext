name: CI

on:
  pull_request:
    branches: [main, codex/entry-provider-nginx-certbot]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: repository checks and secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Verify bilingual README contract
        run: node scripts/check-readme-languages.mjs

      - name: Scan complete Git history for secrets
        run: >-
          docker run --rm
          -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          detect --source=/repo --no-banner --redact --exit-code=1

  api:
    name: control-plane API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-plane/api
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.23.x
          cache: true
          cache-dependency-path: apps/control-plane/api/go.sum
      - name: Test
        run: go test ./...
      - name: Test Node identity lifecycle with MariaDB and Redis ACL
        run: |
          bash testing/node_server_delete_api_test.sh
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/trojanpanelnext-api .

  web:
    name: control-plane Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-plane/web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: apps/control-plane/web/yarn.lock
      - name: Install dependencies
        run: npx --yes yarn@1.22.22 install --frozen-lockfile
      - name: Lint
        run: npx --yes yarn@1.22.22 lint
      - name: Verify UI packages
        run: npx --yes yarn@1.22.22 test:ui-libraries
      - name: Run UI cleanup tests
        run: npx --yes yarn@1.22.22 test:ui-cleanup
      - name: Run Vite proxy tests
        run: npx --yes yarn@1.22.22 test:vite-proxy
      - name: Build
        run: npx --yes yarn@1.22.22 build

  node-agent:
    name: node Agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/node-agent
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.23.x
          cache: true
          cache-dependency-path: apps/node-agent/go.sum
      - name: Test
        run: |
          go test ./...
          bash testing/node_agent_config_cli_test.sh
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/trojanpanelnext-node-agent .

  installer:
    name: installer scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.23.x
          cache: false
      - name: Check Bash syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          count=0
          while IFS= read -r -d '' script; do
            bash -n "$script"
            count=$((count + 1))
          done < <(find deploy/installer -type f -name '*.sh' -print0)
          test "$count" -gt 0
          printf 'validated %d shell scripts\n' "$count"
      - name: Regenerate example release manifest and reject drift
        shell: bash
        run: |
          set -Eeuo pipefail
          bash deploy/installer/release/generate-example-manifest.sh \
            --output deploy/installer/release/example-release-manifest.json
          git diff --exit-code -- deploy/installer/release/example-release-manifest.json
      - name: Test installer CLI contract
        run: |
          bash deploy/installer/tests/installer_cli_test.sh
          bash deploy/installer/tests/node_bundle_cli_test.sh
          bash deploy/installer/tests/node_runtime_container_test.sh
          bash deploy/installer/tests/entry_controller_test.sh
          bash deploy/installer/tests/entry_combined_v2_test.sh
          bash deploy/installer/tests/entry_caddy_adapter_test.sh
          bash deploy/installer/tests/combined_install_test.sh
          bash deploy/installer/tests/dependency_preflight_test.sh
          bash deploy/installer/tests/secure_file_test.sh
          bash deploy/installer/tests/web_bare_install_test.sh
          bash deploy/installer/tests/release_assets_test.sh
          bash deploy/installer/tests/jq_free_release_verification_test.sh
          bash deploy/installer/tests/release_web_docker_smoke_cleanup_test.sh
      - name: Test combined shared Entry with Docker
        run: bash deploy/installer/tests/combined_docker_smoke_test.sh

  docs:
    name: documentation site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/docs-site
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Install dependencies
        run: npx --yes pnpm@8.15.9 install --frozen-lockfile
      - name: Build
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: npx --yes pnpm@8.15.9 run docs:build

  docker-smoke:
    name: released Web and Node Docker smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.23.x
          cache: true
          cache-dependency-path: |
            apps/control-plane/api/go.sum
            apps/node-agent/go.sum
            deploy/installer/nodebundle/go.sum
            deploy/installer/securefile/go.sum
      - name: Smoke released installer entrypoints without credentials in output
        run: bash deploy/installer/tests/docker_smoke_test.sh
      - name: Smoke combined EntryController with real Caddy and local HTTPS
        run: sudo -n bash deploy/installer/tests/entry_caddy_docker_smoke_test.sh

  gate:
    name: gate
    if: always()
    needs: [repository, api, web, node-agent, installer, docs, docker-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to pass
        env:
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          API_RESULT: ${{ needs.api.result }}
          WEB_RESULT: ${{ needs.web.result }}
          NODE_AGENT_RESULT: ${{ needs.node-agent.result }}
          INSTALLER_RESULT: ${{ needs.installer.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          DOCKER_SMOKE_RESULT: ${{ needs.docker-smoke.result }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for result in \
            "$REPOSITORY_RESULT" \
            "$API_RESULT" \
            "$WEB_RESULT" \
            "$NODE_AGENT_RESULT" \
            "$INSTALLER_RESULT" \
            "$DOCS_RESULT" \
            "$DOCKER_SMOKE_RESULT"; do
            test "$result" = success
          done
